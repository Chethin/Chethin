name: Contribution City

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/city.py
      - .github/workflows/city.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate city
        run: python3 scripts/city.py --user ${{ github.repository_owner }} --out dist/city.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CITY_TZ: Australia/Sydney

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
